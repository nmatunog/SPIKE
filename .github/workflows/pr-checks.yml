# SPIKE PR checks. pull_request only. No secrets, no deploy, no wrangler, no Pages.
# Frozen tests not on main:
#   test:sec1-f1            — sec1/f1-hardening-2 @ ec21f13
#   Versa verifier tests    — v1/versa-verifier-portable @ 044e6c6
name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SKIP_AUTO_SHIP: '1'
      AUTO_SHIP: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove postbuild/ship hooks cannot fire
        run: bash scripts/ci-prove-ship-guards.sh

      - name: Lint
        run: |
          if node -e 'process.exit(require("./package.json").scripts.lint ? 0 : 1)'; then
            npm run lint
          else
            echo '::notice::no lint script; skipping'
          fi

      - name: Build
        run: npm run build

      - name: SEC-1 F1 PGlite tests
        run: |
          if node -e 'process.exit(require("./package.json").scripts["test:sec1-f1"] ? 0 : 1)'; then
            npm run test:sec1-f1
          else
            echo '::notice::test:sec1-f1 is not on this ref. Frozen on sec1/f1-hardening-2 @ ec21f13. Skipping.'
          fi

      - name: Versa verifier tests
        run: |
          if node -e 'process.exit(require("./package.json").scripts["test:versa-code"] ? 0 : 1)' \
            && [ -f vitest.versa.config.js ]; then
            npm run test:versa-code
          else
            echo '::notice::Versa verifier tests are not runnable from main. Frozen on v1/versa-verifier-portable @ 044e6c6. Skipping.'
          fi
